<div class="article-meta">
  {{- if .Date }}
    <span class="meta-date">
      <a href="{{- .Permalink }}">
        <time datetime="{{ .Date }}" itemprop="datePublished">{{- .Date.Format (.Site.Params.dateFormat | default "2006-01-02") }}</time>
      </a>
    </span>
  {{- end }}
  <ul class="tag-pills">
    {{- partial "post/tags.html" . -}}
  </ul>
</div>
