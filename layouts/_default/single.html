{{- define "main"}}
{{- $hasToc := gt (len .Fragments.Headings) 0 }}
<div class="page-cols{{ if $hasToc }} has-toc{{ end }}">
  {{- if $hasToc }}
  <div class="toc-col">
    <nav class="toc js-toc"></nav>
  </div>
  {{- end }}
  <main id="content" class="content main-col" role="main">
    {{- partial "section.html" . }}

    {{- if $hasToc }}{{ partial "tocbot-init.html" . }}{{ end }}
  </main>
  <aside class="side-col">
    {{- partial "sidebar.html" . -}}
  </aside>
</div>
{{- end}}
