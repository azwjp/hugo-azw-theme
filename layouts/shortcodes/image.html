{{- $src := .Get "src" }}
{{- $alt := .Get "alt" | default (.Get "caption") | default "" }}
{{- $caption := .Get "caption" }}
<figure class="figure has-text-centered">
  <p>
    <a href="{{ $src }}" rel="lightbox[image]">
      <img src="{{ $src }}" alt="{{ $alt }}">
    </a>
  </p>
  <p class="caption">{{ $caption | safeHTML }}</p>
</figure>
